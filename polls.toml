# Poll definitions. Edited without touching the code.
#
# key       stable identifier, used by /sondage and stored in the database.
#           Changing it after a poll has opened orphans the existing votes.
# label     shown beside the count, 80 characters maximum.
# emoji     required: votes are cast by reacting, so the emoji is the ballot.
#           Two options of the same poll may never share one. 20 options at most.
# icon      optional name of a server emoji, used instead of the unicode one.
#           Until it exists on the server, the emoji above is used.
# multiple  lets one member back several options at once. Off by default.
# max_votes caps how many options one member may back. Needs multiple, and a poll with
#           proposals: only a menu can hold a member to a number, a reaction cannot.
#
# A [polls.proposals] block replaces the options entirely: the members write them
# themselves and the vote moves from reactions to a menu under the message.

[[polls]]
key = "faction"
title = "Quelle faction ?"
description = """
Vote décisif : on crée tous nos personnages du même côté, et la création ouvre \
le 27 octobre. Les 9 classes sont disponibles dans les deux factions, ce choix \
n'engage donc pas le tien.

Réagis avec l'emoji de ta faction. Les deux te vont ? Réagis avec les deux. \
Clôture avant le 25 octobre.
"""
multiple = true
options = [
    { key = "alliance", label = "Alliance", emoji = "🔵", icon = "alliance" },
    { key = "horde", label = "Horde", emoji = "🔴", icon = "horde" },
]

[[polls]]
key = "royaume"
title = "Quel type de royaume ?"
description = """
Vote décisif : on monte tous sur le même royaume, et la création ouvre \
le 27 octobre. JcE pour progresser et raider tranquille, JcJ pour le monde \
ouvert contesté. Le contenu du jeu est le même des deux côtés.

Réagis avec le murloc pour JcE, avec les haches croisées pour JcJ. Les deux te \
vont ? Réagis avec les deux. Clôture avant le 25 octobre.
"""
multiple = true
options = [
    { key = "pve", label = "JcE", emoji = "🛡️", icon = "murloc" },
    { key = "pvp", label = "JcJ", emoji = "⚔️", icon = "pvp" },
]

[[polls]]
key = "nom_guilde"
title = "Quel nom pour la guilde ?"
description = """
Propose le tien, vote pour ceux que tu aimes. Les noms sont réservés dès la \
création des personnages, le 27 octobre, donc clôture avant le 25.

Tu as **3 voix** : choisis-en jusqu'à trois dans le menu, dans n'importe quel \
ordre — elles comptent toutes pareil. Tu peux changer d'avis à tout moment.
"""
multiple = true
max_votes = 3

[polls.proposals]
max_per_member = 2
max_options = 25
min_length = 3
max_length = 24
