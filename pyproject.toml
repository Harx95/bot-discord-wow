[project]
name = "bot-discord-wow"
version = "0.1.0"
description = "Guild bot for a WoW Forever guild"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord.py>=2.7.1",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "src/config", "src/db", "src/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations
    "RUF",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
