# Classes and raid roles. Edited without touching the code.
#
# WoW Forever is not out yet: the playable roles per class are configuration, not
# assumptions baked into the code. The nine classes are available in both factions.
# Skyborne, the paid race, has no Paladin — that belongs to a race poll, not here.
#
# colour  hex, used for the Discord role and therefore for the nickname colour.
# emoji   unicode fallback, shown until the matching icon is uploaded by /emojis.
#
# max_choices  how many classes a member may declare in total, main character
#              included: 3 means one main plus two alternates. The main character
#              drives their Discord role, and therefore their nickname colour.
#              Two boards are posted, so at least 2 is required.

max_choices = 3

