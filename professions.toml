# Professions, in the order the directory shows them: the crafting ones, then the
# gathering ones, then the three the guild does not track.
#
# blizzard_id is the skill line id the profile API answers with. Every one below was read off
# the live API on 20 November 2026, on the whole roster, with no unknown id left over. An id
# this file does not list is still shown in the directory, under the English name the API
# gives it, and logged as a warning so it can be added here.
#
# name is the French label the bot displays; the API only ever answers in English.
#
# ignored = true keeps a profession out of the directory, out of the database and out
# of every search, while still saying it is known rather than letting it look like an
# id nobody configured. The guild does not track Cooking, First Aid or Fishing: nearly
# everyone has them, so they filled the directory and buried the real answers --
# "bandage en lin" alone matched 18 of the 25 characters.

